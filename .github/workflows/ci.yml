name: Build and Deploy to Prod Pipeline
on: 
  push:
    branches: [ "ops/ci-pipeline", "stage"  ]
  pull_request:
    types:
      - closed
    branches: [ "main", "stage" ]
jobs:
  build-images:
    name: Build && push frontend image to docker hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install

      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Setup docker builder
        uses: docker/setup-buildx-action@v3

      - name: Login to docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      #- name: Build and push docker image (Stage images)
      #  uses: docker/build-push-action@v6
      #  with:
      #    context: .
      #    push: true
      #    tags: vertimcoders/all-signs-options:latest

      - name: Build Docker image
        id: build
        run: |
          docker build -t vertimcoders/all-signs-options:${{ env.VERSION }} .

      - name: Push Docker image (dev)
        if: github.ref == 'refs/heads/stage'
        run: |
          docker tag vertimcoders/all-signs-options:${{ env.VERSION }} vertimcoders/all-signs-options:${{ env.VERSION }}-dev
          docker push vertimcoders/all-signs-options:${{ env.VERSION }}-dev
        env:
          DOCKER_BUILDKIT: 1

      - name: Tag and push Docker image (main)
        if: github.event_name == 'pull_request' && github.event.pull_request.merged && github.base_ref == 'main'
        run: |
          docker tag vertimcoders/all-signs-options:${{ env.VERSION }} vertimcoders/all-signs-options:latest
          docker tag vertimcoders/all-signs-options:latest vertimcoders/all-signs-options:latest
          docker push vertimcoders/all-signs-options:${{ env.VERSION }}
          docker push vertimcoders/all-signs-options:latest
        env:
          DOCKER_BUILDKIT: 1

  deploy:
    name: Connect to remote and launch apps
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Extract branch name
        id: extract_branch
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///')
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME="${{ github.base_ref }}"
          else
            echo "Unsupported event: ${{ github.event_name }}"
            exit 1
          fi
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install

      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Remote connexion && Start containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_PASSWORD }}
          PROJECT_NAME: ${{ github.repository }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
          SUBDIR: ${{ env.BRANCH_NAME }}
          VERSION: ${{ env.VERSION }}
        with: 
          host: ${{ secrets.VERTIM_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.VERTIM_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: DOCKER_USERNAME,DOCKER_PWD,PROJECT_NAME,PROJECT_DIR,SUBDIR,VERSION
          script: |
            cd $PROJECT_DIR
            cd $SUBDIR 
            
            echo "=== DÉPLOIEMENT ==="
            echo "Branche: $SUBDIR"
            echo "Version: $VERSION"
            echo "Projet: $PROJECT_NAME"
            
            # Mise à jour du fichier .env
            sed -i "s/^APP_VERSION=.*/APP_VERSION=$VERSION/" .env || echo "APP_VERSION=$VERSION" >> .env
            
            # Connexion Docker Hub
            echo "$DOCKER_PWD" | docker login --username $DOCKER_USERNAME --password-stdin
            
            # Pull des nouvelles images
            echo "Pull des images..."
            docker-compose pull
            
            # Arrêt FORCÉ de tous les conteneurs existants
            echo "Arrêt forcé des conteneurs existants..."
            docker-compose -p $PROJECT_NAME down --remove-orphans --volumes || true
            
            # Nettoyage AGGRESSIF de tous les conteneurs avec ce nom
            echo "Nettoyage agressif..."
            docker rm -f pgdb-stage || true
            docker rm -f frontend-app-stage || true
            docker container prune -f || true
            
            # Démarrage des nouveaux conteneurs
            echo "Démarrage des conteneurs..."
            docker-compose -p $PROJECT_NAME up -d --force-recreate
            
            # Attendre que les conteneurs soient prêts
            echo "Attente du démarrage..."
            sleep 15
            
            # Vérification du statut
            echo "=== STATUT DES CONTAINERS ==="
            docker-compose -p $PROJECT_NAME ps
            
            echo "=== LOGS RÉCENTS ==="
            docker-compose -p $PROJECT_NAME logs --tail=10
            
            echo "=== DÉPLOIEMENT TERMINÉ ==="