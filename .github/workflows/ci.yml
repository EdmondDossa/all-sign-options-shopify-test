name: Build and Deploy to Prod Pipeline
on: 
  push:
    branches: [ "ops/ci-pipeline" ]
  pull_request:
    branches: [ "ops/ci-pipeline" ]
jobs:
  build:
    name: Build && push frontend image to docker hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ops/ci-pipeline
      - name: Setup docker builder
        uses: docker/setup-buildx-action@v3
      - name: Login to docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: vertimcoders/all-signs-options:latest
      - name: Remote connexion && Start containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PWD: ${{ secrets.DOCKERHUB_PASSWORD }}
          PROJECT_NAME: ${{ github.repository }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
        with: 
          host: ${{ secrets.VERTIM_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.VERTIM_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: DOCKER_USERNAME,DOCKER_PWD,PROJECT_NAME,PROJECT_DIR
          scripts: |
            cd $PROJECT_DIR && 
            echo "$DOCKER_PWD" | docker login --username $DOCKER_USERNAME --password-stdin && 
            docker-compose pull &&
            docker-compose -p $PROJECT_DIR up -d