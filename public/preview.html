<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Instrument Sans", "Segoe UI", sans-serif;
        background: #f6f8fa;
      }

      body {
        position: relative;
      }

      #app,
      #aso-preview-stage,
      #aso-frontend-app {
        width: 100%;
        height: 100%;
      }

      .aso-preview-shell,
      .bg-loader,
      #aso-configurator-loader {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .bg-loader {
        overflow: hidden;
        background: #f6f8fa;
      }

      .bg-loader:empty {
        display: none;
      }

      .aso-preview-stage {
        width: 100%;
        height: 100%;
      }

      .aso-preview-error {
        display: grid;
        place-items: center;
        gap: 10px;
        width: 100%;
        height: 100%;
        text-align: center;
        padding: 32px;
        color: #7f1d1d;
      }

      .aso-preview-error h1 {
        margin: 0;
        font-size: 24px;
      }

      .aso-preview-error p {
        margin: 0;
        max-width: 680px;
        color: #991b1b;
      }

      @keyframes aso-pulse-gradient {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      .aso-loader-placeholder {
        background: linear-gradient(to right, #d4d4d8, #f1f5f9, #d4d4d8);
        background-size: 300% 100%;
        animation: aso-pulse-gradient 1.5s ease-in-out infinite;
        border-radius: 8px;
      }

      .aso-loader-wrapper {
        width: 100%;
        min-height: 100%;
        padding: 1.5rem;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .aso-loader-container {
        display: flex;
        width: 100%;
        max-width: 1200px;
        gap: 2rem;
        align-items: stretch;
      }

      .aso-loader-preview {
        flex: 1;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .aso-loader-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .aso-loader-buttons,
      .aso-loader-toolbar-right {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      .aso-loader-toggle-btn {
        width: 48px;
        height: 24px;
      }

      .aso-loader-price {
        width: 112px;
        height: 18px;
      }

      .aso-loader-finish-btn {
        width: 96px;
        height: 42px;
        border-radius: 10px;
      }

      .aso-loader-preview-stage {
        flex: 1;
        display: flex;
        gap: 1rem;
        min-height: 420px;
      }

      .aso-loader-preview-box {
        position: relative;
        flex: 1;
        min-height: 420px;
        background: linear-gradient(180deg, #edf2f7 0%, #e2e8f0 100%);
        border-radius: 18px;
        border: 1px solid #d8e1e8;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .aso-loader-text-box {
        width: min(58%, 420px);
        height: 72px;
        border-radius: 14px;
      }

      .aso-loader-scene-badge {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 120px;
        height: 14px;
      }

      .aso-loader-ruler {
        position: absolute;
        opacity: 0.75;
      }

      .aso-loader-ruler-x {
        left: 24px;
        right: 24px;
        bottom: 22px;
        height: 8px;
      }

      .aso-loader-ruler-y {
        top: 30px;
        bottom: 30px;
        left: 22px;
        width: 8px;
      }

      .aso-loader-toolrail {
        width: 56px;
        padding: 0.75rem 0.5rem;
        border-radius: 18px;
        border: 1px solid #d8e1e8;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        align-items: center;
      }

      .aso-loader-tool-icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }

      .aso-loader-sidebar {
        width: 340px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .aso-loader-section {
        padding: 1rem;
        border-radius: 18px;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .aso-loader-section-title {
        width: 46%;
        height: 14px;
      }

      .aso-loader-style-btn {
        width: 100%;
        height: 40px;
        border-radius: 12px;
      }

      .aso-loader-size-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .aso-loader-size-btn {
        height: 40px;
        border-radius: 12px;
      }

      .aso-loader-choice-row {
        display: flex;
        gap: 0.65rem;
      }

      .aso-loader-chip {
        flex: 1;
        height: 34px;
        border-radius: 999px;
      }

      .aso-loader-button {
        width: 100%;
        height: 46px;
        border-radius: 12px;
      }

      .aso-loader-input {
        width: 100%;
        height: 112px;
        border-radius: 14px;
      }

      @media (max-width: 768px) {
        .aso-loader-container {
          flex-direction: column;
          align-items: center;
        }

        .aso-loader-toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .aso-loader-toolbar-right {
          justify-content: space-between;
        }

        .aso-loader-preview-stage {
          min-height: 320px;
        }

        .aso-loader-preview-box {
          min-height: 320px;
        }

        .aso-loader-toolrail {
          width: 100%;
          flex-direction: row;
          justify-content: center;
          flex-wrap: wrap;
        }

        .aso-loader-sidebar {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <script>
      var asoAdminConfig = "admin";
    </script>
    <div id="app" class="aso-preview-shell">
      <div class="bg-loader">
        <div id="aso-configurator-loader" class="aso-loader-wrapper" aria-hidden="true">
          <div class="aso-loader-container">
            <div class="aso-loader-preview">
              <div class="aso-loader-toolbar">
                <div class="aso-loader-buttons">
                  <div class="aso-loader-placeholder aso-loader-toggle-btn"></div>
                  <div class="aso-loader-placeholder aso-loader-toggle-btn"></div>
                  <div class="aso-loader-placeholder aso-loader-toggle-btn"></div>
                </div>
                <div class="aso-loader-toolbar-right">
                  <div class="aso-loader-placeholder aso-loader-price"></div>
                  <div class="aso-loader-placeholder aso-loader-finish-btn"></div>
                </div>
              </div>

              <div class="aso-loader-preview-stage">
                <div class="aso-loader-preview-box">
                  <div class="aso-loader-placeholder aso-loader-scene-badge"></div>
                  <div class="aso-loader-placeholder aso-loader-text-box"></div>
                  <div class="aso-loader-placeholder aso-loader-ruler aso-loader-ruler-x"></div>
                  <div class="aso-loader-placeholder aso-loader-ruler aso-loader-ruler-y"></div>
                </div>
                <div class="aso-loader-toolrail">
                  <div class="aso-loader-placeholder aso-loader-tool-icon"></div>
                  <div class="aso-loader-placeholder aso-loader-tool-icon"></div>
                  <div class="aso-loader-placeholder aso-loader-tool-icon"></div>
                  <div class="aso-loader-placeholder aso-loader-tool-icon"></div>
                  <div class="aso-loader-placeholder aso-loader-tool-icon"></div>
                  <div class="aso-loader-placeholder aso-loader-tool-icon"></div>
                </div>
              </div>
            </div>

            <div class="aso-loader-sidebar">
              <div class="aso-loader-section">
                <div class="aso-loader-placeholder aso-loader-section-title"></div>
                <div class="aso-loader-placeholder aso-loader-input"></div>
              </div>

              <div class="aso-loader-section">
                <div class="aso-loader-placeholder aso-loader-section-title"></div>
                <div class="aso-loader-placeholder aso-loader-style-btn"></div>
                <div class="aso-loader-size-grid">
                  <div class="aso-loader-placeholder aso-loader-size-btn"></div>
                  <div class="aso-loader-placeholder aso-loader-size-btn"></div>
                  <div class="aso-loader-placeholder aso-loader-size-btn"></div>
                  <div class="aso-loader-placeholder aso-loader-size-btn"></div>
                </div>
              </div>

              <div class="aso-loader-section">
                <div class="aso-loader-placeholder aso-loader-section-title"></div>
                <div class="aso-loader-choice-row">
                  <div class="aso-loader-placeholder aso-loader-chip"></div>
                  <div class="aso-loader-placeholder aso-loader-chip"></div>
                  <div class="aso-loader-placeholder aso-loader-chip"></div>
                </div>
              </div>

              <div class="aso-loader-section">
                <div class="aso-loader-placeholder aso-loader-button"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="aso-preview-stage" class="aso-preview-stage"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script type="module" src="/assets-preview/preview-bootstrap.js?v=20260417"></script>
  </body>
</html>
