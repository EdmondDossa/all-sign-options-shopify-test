<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css" />
    <style>
      :root {
        color-scheme: light;
        --aso-preview-bg: #f4f6f8;
        --aso-preview-card: #ffffff;
        --aso-preview-border: #d9dee3;
        --aso-preview-text: #1f2933;
        --aso-preview-muted: #66788a;
        --aso-preview-accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Instrument Sans", "Segoe UI", sans-serif;
        background: #dceae6;
      }

      body {
        position: relative;
        background-image: var(--aso-preview-bg);
      }

      #app,
      #aso-preview-stage,
      #ncpc-frontend-app {
        width: 100%;
        height: 100%;
      }

      .aso-preview-shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .aso-preview-loader {
        width: min(440px, calc(100vw - 48px));
        padding: 24px;
        border-radius: 18px;
        background: var(--aso-preview-card);
        border: 1px solid var(--aso-preview-border);
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
      }

      .aso-preview-loader__badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #eef6f5;
        color: var(--aso-preview-accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .aso-preview-loader__title {
        margin: 18px 0 10px;
        color: var(--aso-preview-text);
        font-size: 24px;
        line-height: 1.2;
      }

      .aso-preview-loader__copy {
        margin: 0;
        color: var(--aso-preview-muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .aso-preview-loader__progress {
        margin-top: 20px;
        height: 8px;
        border-radius: 999px;
        background: #edf1f4;
        overflow: hidden;
      }

      .aso-preview-loader__progress::before {
        content: "";
        display: block;
        width: 32%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0f766e 0%, #2bb5a8 100%);
        animation: aso-preview-progress 1.4s ease-in-out infinite;
      }

      .aso-preview-stage {
        width: 100%;
        height: 100%;
      }

      .aso-preview-error {
        display: grid;
        place-items: center;
        gap: 10px;
        width: 100%;
        height: 100%;
        text-align: center;
        padding: 32px;
        color: #7f1d1d;
      }

      .aso-preview-error h1 {
        margin: 0;
        font-size: 24px;
      }

      .aso-preview-error p {
        margin: 0;
        max-width: 680px;
        color: #991b1b;
      }

      @keyframes aso-preview-progress {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }

    </style>
  </head>
  <body>
    <script>
      var asoAdminConfig = "admin";
    </script>
    <div id="app" class="aso-preview-shell">
      <div class="aso-preview-loader">
        <div class="aso-preview-loader__badge">ASO Preview</div>
        <h1 class="aso-preview-loader__title">Chargement du configurateur</h1>
        <p id="aso-preview-loader-label" class="aso-preview-loader__copy">
          Préparation de l’aperçu et synchronisation des données.
        </p>
        <div class="aso-preview-loader__progress"></div>
      </div>
      <div id="aso-preview-stage" class="aso-preview-stage"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script type="module" src="/assets-preview/preview-bootstrap.js?v=20260417"></script>
  </body>
</html>
