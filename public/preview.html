<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Preview</title>
    <link rel="stylesheet" href="/assets-preview/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body>
    <script>
        var asoAdminConfig = "admin";

    </script>
    <div id="app" class="aso-app" >

    </div>
    <style>
        .aso-app p {
          margin-top: 0px !important;
          margin-bottom: 0px !important;
        }
        
        .no-scrollbar::-webkit-scrollbar {
          display: none;
          overflow: auto;
        }
        
        .aso-scrollBar::-webkit-scrollbar {
          width: 6px;
          height: 4px;
          overflow: scroll;
        }
        .aso-scrollBar::-webkit-scrollbar-thumb {
          background-color: #016464;
          border-radius: 20px;
        }
         
        .aso-base-animation{
          transition-property: all;
          transition-duration: 500ms;
        }
        .aso-full-center {
          justify-content: center !important;
          align-items: center !important;
          /* white-space: nowrap; */
        }
        
        .aso-option-buton{
          width: fit-content;
          height: 90%;
          display: flex;
          flex-direction: column;
        }
      
        .aso-app{
          height: 100vh;
          width: 100%;
        }
        .aso-app *:not(input):empty {
          display: flex !important;
        }
        .shopify-app-wrapper{
          margin: 2rem 0rem
        }
      
        .aso-app .aso-inputColor-hide {
          display: none;
        }
      
        .aso-app .aso-advanceModel-img,.aso-app img.aso-w-auto{
          width: -webkit-fill-available;
          width: -moz-available; /* For Firefox */
          width: fill-available;
        }
      
      
        .aso-app .aso-inputImage {
          /* aso-text-md  */   
          display: flex !important;
          padding: 8px 14px 8px 14px !important;
          border-radius: 9999px !important;
          cursor: pointer !important;
        }

        #aso-configurator-loader .skeleton-loader:empty {
  
          display: block;
          background: linear-gradient(
              to right,
              rgba(255, 255, 255, 0),
              rgba(255, 255, 255, 0.5) 50%,
              rgba(255, 255, 255, 0) 80%
            ),
            lightgray;
          background-repeat: repeat-y;
          background-size: 50px 500px;
          background-position: 0 0;
          animation: shine 1s infinite;
          
        }
        
        @keyframes shine {
          to {
            background-position: 100% 0;
          }
        
          
        }
        
        
        #aso-configurator-loader{
          width: 100%;
        }
        
      
      
      
      </style>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="/assets-preview/shopify.js"></script>
    <script src="/assets-preview/fabric.min.js"></script>
    <script type="module" crossorigin  src="/assets-preview/index.js"></script>
</body>
</html>
