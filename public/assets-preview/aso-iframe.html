    <style>
      body {
        overflow: clip;
      }
      
      .aso-app p {
        margin-top: 0px !important;
        margin-bottom: 0px !important;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
        overflow: auto;
      }
      
      .aso-scrollBar::-webkit-scrollbar {
        width: 6px;
        height: 4px;
        overflow: scroll;
      }
      .aso-scrollBar::-webkit-scrollbar-thumb {
        background-color: #016464;
        border-radius: 20px;
      }
      
      .aso-base-animation {
        transition-property: all;
        transition-duration: 500ms;
      }
      .aso-full-center {
        justify-content: center !important;
        align-items: center !important;
        /* white-space: nowrap; */
      }
      
      .aso-option-buton {
        width: fit-content;
        height: 90%;
        display: flex;
        flex-direction: column;
      }
      
      .aso-app {
        height: 100vh;
        width: 100%;
      }
      .aso-app *:not(input):empty {
        display: flex !important;
      }
      .shopify-app-wrapper {
        margin: 2rem 0rem;
      }
      
      .aso-app .aso-inputColor-hide {
        display: none;
      }
      
      .aso-app .aso-advanceModel-img,
      .aso-app img.aso-w-auto {
        width: -webkit-fill-available;
        width: -moz-available; /* For Firefox */
        width: fill-available;
      }
      
      .aso-app .aso-inputImage {
        /* aso-text-md  */
        display: flex !important;
        padding: 8px 14px 8px 14px !important;
        border-radius: 9999px !important;
        cursor: pointer !important;
      }

      .bg-loader {
        background: #f6f8fa;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        position: relative;
      }

      .bg-loader:empty {
        display: none;
      }

      #aso-configurator-loader {
        width: 100%;
      }

      @keyframes aso-pulse-gradient {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      .aso-loader-placeholder {
        background: linear-gradient(to right, #d4d4d8, #f1f5f9, #d4d4d8);
        background-size: 300% 100%;
        animation: aso-pulse-gradient 1.5s ease-in-out infinite;
        border-radius: 8px;
      }

      .aso-loader-wrapper {
        width: 100%;
        min-height: min(90vh, 720px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .aso-loader-container {
        display: flex;
        width: 100%;
        max-width: 1200px;
        gap: 2rem;
        align-items: stretch;
      }

      .aso-loader-preview {
        flex: 1;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .aso-loader-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .aso-loader-buttons,
      .aso-loader-toolbar-right {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      .aso-loader-toggle-btn {
        width: 48px;
        height: 24px;
      }

      .aso-loader-price {
        width: 112px;
        height: 18px;
      }

      .aso-loader-finish-btn {
        width: 96px;
        height: 42px;
        border-radius: 10px;
      }

      .aso-loader-preview-stage {
        flex: 1;
        display: flex;
        gap: 1rem;
        min-height: 420px;
      }

      .aso-loader-preview-box {
        position: relative;
        flex: 1;
        min-height: 420px;
        background: linear-gradient(180deg, #edf2f7 0%, #e2e8f0 100%);
        border-radius: 18px;
        border: 1px solid #d8e1e8;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .aso-loader-text-box {
        width: min(58%, 420px);
        height: 72px;
        border-radius: 14px;
      }

      .aso-loader-scene-badge {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 120px;
        height: 14px;
      }

      .aso-loader-ruler {
        position: absolute;
        opacity: 0.75;
      }

      .aso-loader-ruler-x {
        left: 24px;
        right: 24px;
        bottom: 22px;
        height: 8px;
      }

      .aso-loader-ruler-y {
        top: 30px;
        bottom: 30px;
        left: 22px;
        width: 8px;
      }

      .aso-loader-toolrail {
        width: 56px;
        padding: 0.75rem 0.5rem;
        border-radius: 18px;
        border: 1px solid #d8e1e8;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        align-items: center;
      }

      .aso-loader-tool-icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }

      .aso-loader-sidebar {
        width: 340px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .aso-loader-section {
        padding: 1rem;
        border-radius: 18px;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .aso-loader-section-title {
        width: 46%;
        height: 14px;
      }

      .aso-loader-style-btn {
        width: 100%;
        height: 40px;
        border-radius: 12px;
      }

      .aso-loader-size-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .aso-loader-size-btn {
        height: 40px;
        border-radius: 12px;
      }

      .aso-loader-choice-row {
        display: flex;
        gap: 0.65rem;
      }

      .aso-loader-chip {
        flex: 1;
        height: 34px;
        border-radius: 999px;
      }

      .aso-loader-button {
        width: 100%;
        height: 46px;
        border-radius: 12px;
      }

      .aso-loader-input {
        width: 100%;
        height: 112px;
        border-radius: 14px;
      }

      @media (max-width: 768px) {
        .aso-loader-container {
          flex-direction: column;
          align-items: center;
        }

        .aso-loader-toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .aso-loader-toolbar-right {
          justify-content: space-between;
        }

        .aso-loader-preview-stage {
          min-height: 320px;
        }

        .aso-loader-preview-box {
          min-height: 320px;
        }

        .aso-loader-toolrail {
          width: 100%;
          flex-direction: row;
          justify-content: center;
          flex-wrap: wrap;
        }

        .aso-loader-sidebar {
          width: 100%;
        }
      }
    </style>
